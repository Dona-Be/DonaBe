name: Bug
description: Algo no DonaBe não funciona como deveria.
title: "[Bug] "
labels: ["Bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Passo a passo, do começo, para quem nunca viu o problema.
      placeholder: |
        1. Entre com o Google
        2. Clique em ...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Onde aconteceu
      description: Navegador e sistema, e se foi no site publicado ou no ambiente local.
      placeholder: Firefox 130 no Linux, ambiente local
    validations:
      required: true
