name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgis:
        image: postgis/postgis:17-3.6-alpine@sha256:a8ffa9afeea4ad6eada171fa2afdb57cd3eb90f92ce20156aa2cb8411d70e0cd
        env:
          POSTGRES_USER: donabe
          POSTGRES_PASSWORD: donabe
          POSTGRES_DB: donabe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U donabe -d donabe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out the code (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python (actions/setup-python v7.0.0)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install the backend dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Lint the backend
        working-directory: server
        run: |
          ruff check .
          ruff format --check .

      - name: Test the backend with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://donabe:donabe@localhost:5432/donabe_test
        run: >-
          pytest server
          --cov
          --cov-config=server/pyproject.toml
          --cov-report=term
          --cov-report=xml:server/coverage.xml

      - name: Set up Node (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Lint the frontend
        working-directory: web
        run: npm run lint

      - name: Build the frontend
        working-directory: web
        run: npm run build

      - name: Test the frontend with coverage
        working-directory: web
        run: npm run coverage

      - name: Analyze on SonarCloud and wait for the quality gate (SonarSource/sonarqube-scan-action v8.3.0)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
