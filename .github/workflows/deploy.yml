name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  backend:
    name: Backend on Render
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: producao

    steps:
      - name: Trigger the Render deploy hook for the tested commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL secret is missing in the producao environment. Nothing was deployed."
            exit 1
          fi
          curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA"

  build_frontend:
    name: Build the frontend
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            .github/tools/vercel/package-lock.json
            web/package-lock.json

      - name: Install the pinned Vercel CLI
        working-directory: .github/tools/vercel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare the project settings, without any token
        run: |
          mkdir -p .vercel
          cp .github/tools/vercel/project.json .vercel/project.json

      - name: Build the frontend
        run: vercel build --prod

      - name: Keep the built frontend (actions/upload-artifact v7.0.1)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: built-frontend
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend on Vercel
    needs: [backend, build_frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao

    steps:
      - name: Check that the Vercel secrets exist
        env:
          TOKEN_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' }}
          ORG_CONFIGURED: ${{ secrets.VERCEL_ORG_ID != '' }}
          PROJECT_CONFIGURED: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          missing=""
          [ "$TOKEN_CONFIGURED" = "true" ] || missing="$missing VERCEL_TOKEN"
          [ "$ORG_CONFIGURED" = "true" ] || missing="$missing VERCEL_ORG_ID"
          [ "$PROJECT_CONFIGURED" = "true" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the producao environment:$missing. The API was deployed; the frontend was not."
            exit 1
          fi

      - name: Check out the code (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node (actions/setup-node v7.0.0)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install the pinned Vercel CLI
        working-directory: .github/tools/vercel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare the project settings
        run: |
          mkdir -p .vercel
          cp .github/tools/vercel/project.json .vercel/project.json

      - name: Get the built frontend (actions/download-artifact v8.0.1)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: built-frontend
          path: .vercel/output

      - name: Deploy the frontend to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes
