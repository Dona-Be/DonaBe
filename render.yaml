services:
  - type: web
    name: donabe-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: virginia
    branch: main
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: ENVIRONMENT
        value: producao
      - key: DATABASE_URL
        fromDatabase:
          name: donabe-db
          property: connectionString
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: donabe-db
    databaseName: donabe
    user: donabe
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []
